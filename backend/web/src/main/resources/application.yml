# ─────────────────────────────────────────
# 4) “default” PROFILE (loaded if no profile is specified)
# ─────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: default

# (Put any true “fallback” defaults here; often left empty in dev setups.)

# ─────────────────────────────────────────
# 5) “production” PROFILE (only loaded when “production” is active)
# ─────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: production

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: production
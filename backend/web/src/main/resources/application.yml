# ─── application.yml ───

# ─────────────────────────────────────────
# 1) COMMON (always-loaded on any run)
# ─────────────────────────────────────────
spring:
  profiles:
    active: dev,secrets
  config:
    import: optional:dotenv:./.env

management:
  endpoints:
    web:
      exposure:
        include: health


# ─────────────────────────────────────────
# 2) “dev” PROFILE (only loaded when “dev” is active)
# ─────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: dev

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Commented out for Heroku deployment - using DATABASE_URL environment variable
  # datasource:
  #   url: jdbc:postgresql://expense-db:5432/expense_db
  #   username: keycloak
  #   password: secret
  #   driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update    # or “none”
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: development,production
    drop-first: false

server:
  port: 8443
  http:
    port: 8080
  ssl:
    key-store: classpath:certs/localhost-keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: tomcat

app:
  base-url: https://localhost:5173

jwt:
  access-token-exp-ms: 60000           # 15 minutes = 15 * 60 * 1000
  refresh-token-exp-ms: 2592000000     # 30 days  = 30 * 24 * 60 * 60 * 1000

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    org.springframework.security: TRACE

    com.expensetracker.security: DEBUG
    com.expensetracker.security.JwtAuthenticationFilter: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: mappings,health



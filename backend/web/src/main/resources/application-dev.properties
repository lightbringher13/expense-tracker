# ─── application-dev.properties ───

# 1) Tell Spring Boot to bind HTTPS on port 8443
server.port=8443

# 2) SSL/keystore configuration (point at your PKCS#12 file under classpath)
server.ssl.key-store=classpath:certs/localhost-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# ── PostgreSQL for local dev instead of H2 ──
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_db
spring.datasource.username=expense_user
spring.datasource.password=your_local_pg_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (dev-friendly)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql: true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# application.properties
app.base-url=https://localhost:5173

# Expirations in milliseconds:
#  15 minutes = 15 * 60 * 1000 = 900000
jwt.access-token-exp-ms=60000

#  30 days  = 30 * 24 * 60 * 60 * 1000 = 2592000000
jwt.refresh-token-exp-ms=2592000000

# Mail: local SMTP catcher (unchanged)
spring.mail.host=smtp.gmail.com
spring.mail.port=587


spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.properties.mail.smtp.starttls.required = true
spring.mail.properties.mail.smtp.connectiontimeout = 5000
spring.mail.properties.mail.smtp.timeout = 5000
spring.mail.properties.mail.smtp.writetimeout = 5000

# Tell Spring Boot to import variables from a .env file
spring.config.import=optional:dotenv:./.env

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.org.springframework.security=TRACE

# JWT defaults (common, but can override per profile if needed)
management.endpoints.web.exposure.include=mappings,health

# Enable debug-level logging for the entire security package:
logging.level.com.expensetracker.security=DEBUG

# …or just for this filter class if you prefer:
logging.level.com.expensetracker.security.JwtAuthenticationFilter=DEBUG